[project]
name = "Python Quizy"
version = "1.0.0"
description = "Python Quizy – Interactive Python quiz app with 500+ questions across 10 topics"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Python Quizy", email = "pyquizy@example.com" }
]
dependencies = [
    "flet>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "flet[all]>=0.25.0",
]

[tool.flet]
org = "com.pyquizy"
product = "Python Quizy"
company = "Python Quizy"
copyright = "Copyright (c) 2025 Python Quizy"
bundle_id = "com.pyquizy.app"

[tool.flet.app]
path = "."

[tool.flet.android]
adaptive_icon_background = "#FFD43B"

[tool.flet.ios]
